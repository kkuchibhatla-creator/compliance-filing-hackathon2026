<template>
    <div class="canvas">
        <!-- product row: mark, product, scope, use-case switcher, freshness -->
        <div class="product">
            <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M3 3h14v4.2a2.8 2.8 0 0 0 0 5.6V17H3v-4.2a2.8 2.8 0 0 0 0-5.6z" fill="#141414"></path>
                <path d="M6.8 10.2l2.2 2.2 4.4-4.6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span class="product-name">AgentPass</span>
            <span class="scope">Agentforce use cases</span>
            <span class="spacer"></span>
            <lightning-combobox class="switcher" label="Use case" variant="label-hidden" value={caseId} options={caseOptions} onchange={handleSelect} disabled={busy} placeholder="Choose a use case"></lightning-combobox>
            <span class="stamp">{freshness}</span>
            <button class="btn btn-ghost" type="button" onclick={handleRefresh} disabled={busy}>Refresh</button>
            <template lwc:if={canManage}>
                <button class="btn btn-ghost" type="button" onclick={handleSeed} disabled={busy}>Load bank demos</button>
                <button class="btn btn-ghost" type="button" onclick={handleNew} disabled={busy}>New use case</button>
            </template>
        </div>

        <template lwc:if={busy}><lightning-spinner alternative-text="Updating" size="small"></lightning-spinner></template>
        <template lwc:if={error}><p class="message message-error" role="alert">{error}</p></template>
        <template lwc:if={notice}><p class="message" role="status">{notice}</p></template>

        <template lwc:if={editing}>
            <section class="card editor" aria-labelledby="intake-title">
                <div class="card-head"><h2 id="intake-title" tabindex="-1" data-editor-title>Use case scope</h2></div>
                <p class="card-lede">These declared facts decide which controls apply and what each reviewer signs. Keep each description within 2,000 characters.</p>
                <form class="card-body" onsubmit={handleSave}>
                    <div class="form-grid">
                        <lightning-input data-intake data-field="Name" label="Use case name" value={form.Name} onchange={handleField} maxlength="80" required></lightning-input>
                        <lightning-combobox data-intake data-field="Sector__c" label="Regulated sector" options={sectorOptions} value={form.Sector__c} onchange={handleField} required></lightning-combobox>
                        <lightning-combobox data-intake data-field="Bank_Type__c" label="Bank type (when the sector is Bank)" options={bankTypeOptions} value={form.Bank_Type__c} onchange={handleField}></lightning-combobox>
                        <lightning-input data-intake data-field="Retention_Days__c" type="number" label="Declared retention in days" value={form.Retention_Days__c} onchange={handleField} min="1" max="36500" step="1" required></lightning-input>
                        <lightning-textarea data-intake data-field="Purpose__c" label="Purpose and customer impact" value={form.Purpose__c} onchange={handleField} maxlength="2000" required></lightning-textarea>
                        <lightning-textarea data-intake data-field="Permitted_Actions__c" label="Permitted actions and human boundaries" value={form.Permitted_Actions__c} onchange={handleField} maxlength="2000" required></lightning-textarea>
                        <lightning-textarea data-intake data-field="Data_Categories__c" label="Data categories and exclusions" value={form.Data_Categories__c} onchange={handleField} maxlength="2000"></lightning-textarea>
                        <lightning-textarea data-intake data-field="Processing_Locations__c" label="Processing locations and subprocessors" value={form.Processing_Locations__c} onchange={handleField} maxlength="2000" required></lightning-textarea>
                    </div>
                    <fieldset class="flags"><legend>Scope signals</legend>
                        <lightning-input data-field="Personal_Data__c" type="checkbox" label="Processes personal data" checked={form.Personal_Data__c} onchange={handleField}></lightning-input>
                        <lightning-input data-field="Customer_Facing__c" type="checkbox" label="Customer-facing" checked={form.Customer_Facing__c} onchange={handleField}></lightning-input>
                        <lightning-input data-field="Cross_Border__c" type="checkbox" label="Includes overseas processing" checked={form.Cross_Border__c} onchange={handleField}></lightning-input>
                        <lightning-input data-field="Cloud_Outsourcing__c" type="checkbox" label="Includes cloud or IT outsourcing" checked={form.Cloud_Outsourcing__c} onchange={handleField}></lightning-input>
                        <lightning-input data-field="Material_IT_Outsourcing__c" type="checkbox" label="IT outsourcing is material (reviewer confirms)" checked={form.Material_IT_Outsourcing__c} onchange={handleField}></lightning-input>
                    </fieldset>
                    <div class="row-actions">
                        <button class="btn btn-primary" type="submit" disabled={busy}>Save scope</button>
                        <button class="btn btn-secondary" type="button" onclick={handleCancel} disabled={busy}>Cancel</button>
                    </div>
                </form>
            </section>
        </template>

        <template lwc:if={hasCase}>
            <!-- title row: the noun, the finding, the one primary action -->
            <div class="title-row">
                <div class="title-text">
                    <p class="crumb">Use cases /</p>
                    <h1>{caseName}<template lwc:if={isDemo}><span class="chip">Synthetic demo</span></template></h1>
                    <p class="finding"><template lwc:if={hasFindingLead}><strong>{finding.lead}</strong></template>{finding.text}</p>
                </div>
                <div class="actions">
                    <template lwc:if={holdText}><span class="hold">{holdText}</span></template>
                    <template lwc:if={canManage}><button class="btn btn-secondary" type="button" onclick={handleEdit} disabled={busy}>Edit scope</button></template>
                    <template lwc:if={showPrepareSecondary}><button class="btn btn-secondary" type="button" onclick={handlePrepare} disabled={disablePrepare}>Prepare filing</button></template>
                    <template lwc:if={hasPrimary}><button class="btn btn-primary" type="button" onclick={handlePrimary} disabled={busy}>{primaryLabel}</button></template>
                </div>
            </div>

            <div class="tabs" role="tablist" aria-label="Use case views" onkeydown={handleTabKey}>
                <template for:each={tabs} for:item="tab">
                    <button key={tab.id} class="tab" role="tab" type="button" aria-selected={tab.selected} tabindex={tab.tabindex} data-view={tab.id} onclick={handleTab}>{tab.label}</button>
                </template>
            </div>

            <!-- ================= OVERVIEW ================= -->
            <template lwc:if={isOverview}>
                <section class="card readiness" aria-label="Readiness">
                    <div class="strip">
                        <div class="fig fig-lead"><p class="fig-label">Controls evidenced</p>
                            <p class="fig-value">{evidencedCount}<span class="of"> of {applicableCount}</span></p>
                            <p class={openFigClass}>{openSummary}</p></div>
                        <div class="fig"><p class="fig-label">Gates cleared</p>
                            <p class="fig-value">{clearedCount}<span class="of"> of 5</span></p>
                            <p class="fig-sub">{gatesSub}</p></div>
                        <div class="fig"><p class="fig-label">Proposed risk tier</p>
                            <p class="fig-value">{riskLevel}</p>
                            <p class="fig-sub">{riskSignals}</p></div>
                        <div class="fig"><p class="fig-label">Release</p>
                            <p class="fig-value">{releaseLabel}</p>
                            <p class="fig-sub">Needs 5 of 5 sign-offs on current evidence</p></div>
                    </div>
                    <div class="gates" role="list" aria-label="Sign-off gates">
                        <template for:each={gates} for:item="gate">
                            <div class="gate" role="listitem" key={gate.role}>
                                <div class="gate-top"><span class="gate-role">{gate.role}</span><template lwc:if={gate.pill}><span class={gate.pill.cls}>{gate.pill.label}</span></template></div>
                                <p class="gate-who">{gate.reviewer}</p>
                                <div class="segs" aria-hidden="true">
                                    <template for:each={gate.segs} for:item="seg"><span key={seg.key} class={seg.cls} title={seg.title}></span></template>
                                </div>
                                <p class="gate-count">{gate.evidenced}<span class="muted">{gate.ofLabel}</span></p>
                                <template lwc:if={gate.note}><p class={gate.noteClass}>{gate.note}</p></template>
                                <template lwc:else><p class="gate-note"><template for:each={gate.keys} for:item="k"><span key={k} class="key">{k}</span></template></p></template>
                            </div>
                        </template>
                    </div>
                </section>

                <div class="grid">
                    <section class="card" aria-labelledby="ct">
                        <div class="card-head"><h2 id="ct">Controls and evidence</h2><span class="meta">{libraryLabel}</span></div>
                        <table>
                            <thead><tr><th scope="col">Control</th><th scope="col">Requirement</th><th scope="col" class="r">Valid through</th><th scope="col" class="r">Status</th></tr></thead>
                            <tbody>
                                <template for:each={controlRows} for:item="c">
                                    <tr key={c.Control_Key__c} class={c.rowClass}>
                                        <td class="c-key"><span class="mono">{c.Control_Key__c}</span></td>
                                        <td class="c-title"><p class="ctl-title">{c.Title__c}</p><p class="ctl-clause">{c.subline}</p>
                                            <template lwc:if={c.open}><template lwc:if={canManage}><p class="row-action"><button class="btn-text" type="button" data-key={c.Control_Key__c} onclick={handleAttachRow}>Attach evidence</button></p></template></template></td>
                                        <td class="c-valid r num"><template lwc:if={c.validThrough}>{c.validThrough}</template><template lwc:else><span class="dash">—</span></template></td>
                                        <td class="c-status r"><span class={c.pill.cls}>{c.pill.label}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template lwc:if={hasNotApplicable}>
                            <p class="na">{notApplicableLabel}<template for:each={notApplicableRows} for:item="n"><span key={n.key} class="na-item"> <span class="mono">{n.key}</span> ({n.reason}){n.sep}</span></template></p>
                        </template>
                    </section>

                    <div class="side">
                        <section class="card" aria-labelledby="nx">
                            <div class="card-head"><h2 id="nx">Before filing</h2><span class="meta">{stepsDone}</span></div>
                            <ol class="steps">
                                <template for:each={steps} for:item="s"><li key={s.id} class={s.cls}><span class="tick" aria-hidden="true"></span><span>{s.label}</span><span class="when num">{s.figure}</span></li></template>
                            </ol>
                        </section>
                        <section class="card" aria-labelledby="fl">
                            <div class="card-head"><h2 id="fl">{filingTitle}</h2><span class="meta">{filingPrepared}</span></div>
                            <dl class="kv">
                                <template for:each={filingFacts} for:item="f"><div key={f.k}><dt>{f.k}</dt><dd class={f.cls}>{f.v}</dd></div></template>
                            </dl>
                        </section>
                        <section class="card" aria-labelledby="hs">
                            <div class="card-head"><h2 id="hs">Decision history</h2><template lwc:if={hasHistory}><button class="link" type="button" onclick={handleViewAll}>{historyTotalLabel}</button></template></div>
                            <template lwc:if={hasHistory}>
                                <ol class="feed">
                                    <template for:each={recentHistory} for:item="h"><li key={h.Id}><div class="ev"><span>{h.label}</span><span class="when">{h.when}</span></div><p class="detail">{h.detail}</p></li></template>
                                </ol>
                            </template>
                            <template lwc:else><p class="empty-line">No events yet. Saving the scope starts the record.</p></template>
                        </section>
                    </div>
                </div>
            </template>

            <!-- ================= CONTROLS ================= -->
            <template lwc:if={isControls}>
                <template lwc:if={canManage}>
                    <section class="card upload" aria-labelledby="up">
                        <div class="card-head"><h2 id="up" tabindex="-1" data-upload-title>Attach evidence to a control</h2></div>
                        <p class="card-lede">Images, PDFs, Word documents, text or any file type your org allows. Choose the control and validity date first. AgentPass pins the exact file version, its checksum, the scope it was attached under and the date it stops being valid. Text files up to 20 KB keep readable text; other files keep the pinned original for a human to open.</p>
                        <div class="card-body">
                            <div class="form-grid">
                                <lightning-combobox label="Applicable control" value={selectedControl} options={controlOptions} onchange={handleControl} disabled={busy}></lightning-combobox>
                                <lightning-input type="date" label="Evidence valid through" value={expiry} onchange={handleExpiry} disabled={busy}></lightning-input>
                            </div>
                            <div class="row-actions">
                                <lightning-file-upload label="Upload and snapshot evidence" record-id={caseId} onuploadfinished={handleUpload} disabled={evidenceUploadDisabled}></lightning-file-upload>
                                <template lwc:if={hasPendingUpload}><button class="btn btn-ghost" type="button" onclick={handleRetryUpload} disabled={evidenceUploadDisabled}>Retry evidence snapshot</button></template>
                                <template lwc:if={isDemo}><button class="btn btn-secondary" type="button" onclick={handleDemoEvidence} disabled={evidenceUploadDisabled}>Attach synthetic demo evidence</button></template>
                            </div>
                            <template lwc:if={hasPendingUpload}><p class="cl-meta">The file is uploaded. If the snapshot failed, fix the issue above and choose Retry evidence snapshot; there is no need to upload it again.</p></template>
                        </div>
                    </section>
                </template>
                <section class="card" aria-labelledby="cl">
                    <div class="card-head"><h2 id="cl">Applicable controls</h2><span class="meta">{evidencedCount} of {applicableCount} evidenced</span></div>
                    <ul class="control-list">
                        <template for:each={controlRows} for:item="c">
                            <li key={c.Control_Key__c} class={c.rowClass}>
                                <div class="cl-top"><span class="mono">{c.Control_Key__c}</span><span class="ctl-title">{c.Title__c}</span><span class="spacer"></span><span class={c.pill.cls}>{c.pill.label}</span></div>
                                <p class="ctl-clause">{c.subline}</p>
                                <p class="cl-text">{c.Explanation__c}</p>
                                <p class="cl-legal">{c.Legal_Status__c}</p>
                                <div class="cl-links">
                                    <template lwc:if={c.hasSource}><a href={c.Source_URL__c} target="_blank" rel="noopener noreferrer">Regulatory source</a></template>
                                    <template lwc:if={c.hasProof}>
                                        <details>
                                            <summary>Evidence snapshot · valid through {c.proof.Expires_On__c} · {c.checksumLabel} <span class="mono">{c.hashShort}</span></summary>
                                            <p class="cl-meta"><a href={c.sourceLink} target="_blank" rel="noopener noreferrer">Download the pinned file version</a></p>
                                            <p class="cl-meta mono wrap">{c.proof.Content_Hash__c}</p>
                                            <p class="preserve">{c.proof.Snapshot__c}</p>
                                        </details>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                    <template lwc:if={hasNotApplicable}>
                        <p class="na">{notApplicableLabel}<template for:each={notApplicableRows} for:item="n"><span key={n.key} class="na-item"> <span class="mono">{n.key}</span> ({n.reason}){n.sep}</span></template></p>
                    </template>
                </section>
            </template>

            <!-- ================= SIGN-OFFS ================= -->
            <template lwc:if={isSignoffs}>
                <section class="card" aria-labelledby="executive-summary">
                    <div class="card-head"><h2 id="executive-summary">Executive summary</h2><span class="meta">{libraryLabel}</span></div>
                    <div class="card-body"><p class="preserve">{executiveSummary}</p></div>
                </section>
                <template lwc:if={canManage}>
                    <section class="card" aria-labelledby="as">
                        <div class="card-head"><h2 id="as" tabindex="-1" data-assign-title>Reviewers for the five gates</h2><span class="meta">{assignedCount} of 5 assigned</span></div>
                        <p class="card-lede">Active users with the Compliance Filing Reviewer permission set. Filing creates native Salesforce approval requests; a gate whose scope is unchanged keeps its earlier human decision.</p>
                        <div class="card-body">
                            <div class="assign-grid">
                                <template for:each={reviewerAssignments} for:item="a"><lightning-record-picker key={a.role} label={a.role} object-api-name="User" value={a.value} data-role={a.role} onchange={handleApprover} disabled={busy}></lightning-record-picker></template>
                            </div>
                            <div class="row-actions">
                                <button class="btn btn-primary" type="button" onclick={handleSubmit} disabled={disableSubmit}>File for sign-off</button>
                                <template lwc:if={submitHold}><span class="hold">{submitHold}</span></template>
                            </div>
                        </div>
                    </section>
                </template>
                <template lwc:if={hasReviews}>
                    <div class="review-grid">
                        <template for:each={reviewRows} for:item="r">
                            <section class="card review" key={r.Id} aria-label={r.Reviewer_Role__c}>
                                <div class="card-head"><h2>{r.Reviewer_Role__c}</h2><span class={r.pill.cls}>{r.pill.label}</span></div>
                                <div class="card-body">
                                    <p class="muted">{r.approverName} · {r.gate.evidenced}{r.gate.ofLabel}</p>
                                    <template lwc:if={r.affected}><p class="note-warn">Inputs or evidence this gate depends on changed. It needs another review.</p></template>
                                    <template lwc:if={r.carried}><p class="cl-text">{r.Rationale__c}</p><p class="cl-meta"><a href={r.previousLink} target="_blank" rel="noopener noreferrer">Original human decision</a></p></template>
                                    <details><summary>Reviewer brief</summary><p class="preserve">{r.Brief__c}</p></details>
                                    <template lwc:if={r.hasAiDraft}><details><summary>AI-generated draft · a human verifies every claim</summary><p class="preserve">{r.AI_Draft__c}</p><p class="cl-meta mono wrap">Generation {r.AI_Generation_Id__c}</p></details></template>
                                    <template lwc:if={canManage}><p class="row-action"><button class="btn-text" type="button" data-role={r.Reviewer_Role__c} onclick={handleGenerateDraft} disabled={r.disableGenerate}>Generate AI reviewer draft</button></p></template>
                                    <template lwc:if={r.canDecide}>
                                        <lightning-textarea label="Decision rationale" value={r.rationale} data-id={r.Id} onchange={handleRationale} maxlength="3000" disabled={r.disabled}></lightning-textarea>
                                        <div class="row-actions">
                                            <button class="btn btn-primary" type="button" data-id={r.Id} data-decision="Approve" onclick={handleDecision} disabled={r.disabled}>Approve</button>
                                            <button class="btn btn-danger" type="button" data-id={r.Id} data-decision="Reject" onclick={handleDecision} disabled={r.disabled}>Reject and request rework</button>
                                        </div>
                                    </template>
                                    <p class="cl-meta"><a href={r.recordLink} target="_blank" rel="noopener noreferrer">Review record</a></p>
                                </div>
                            </section>
                        </template>
                    </div>
                </template>
                <template lwc:else><p class="empty-box">No gates yet. Prepare a filing to create the five review gates.</p></template>
            </template>

            <!-- ================= HISTORY ================= -->
            <template lwc:if={isHistory}>
                <section class="card" aria-labelledby="hx">
                    <div class="card-head"><h2 id="hx">Decision history</h2><span class="meta">Latest 100 events, newest first</span></div>
                    <template lwc:if={hasHistory}>
                        <ol class="feed">
                            <template for:each={auditRows} for:item="h">
                                <li key={h.Id}>
                                    <div class="ev"><span>{h.label}</span><span class="when num">{h.stampLabel}</span></div>
                                    <p class="detail">{h.detail}</p>
                                    <details><summary>Event record</summary><p class="preserve mono">{h.Details__c}</p></details>
                                </li>
                            </template>
                        </ol>
                    </template>
                    <template lwc:else><p class="empty-line">No events yet. Saving the scope starts the record.</p></template>
                </section>
            </template>

            <p class="foot">Evidence attached means supplied, not verified. Reviewers confirm applicability and adequacy; deployment needs a separate controlled action. {limitations}</p>
        </template>

        <template lwc:elseif={showFirstRun}>
                <section class="card first-run">
                    <h1>Agentforce use cases</h1>
                    <p class="finding">No use case yet. Describe one to see which RBI and DPDP controls apply and who signs off, or load the synthetic Nila Bank demo.</p>
                    <template lwc:if={canManage}>
                        <div class="row-actions">
                            <button class="btn btn-primary" type="button" onclick={handleNew} disabled={busy}>New use case</button>
                            <button class="btn btn-secondary" type="button" onclick={handleSeed} disabled={busy}>Load bank demos</button>
                        </div>
                    </template>
                </section>
        </template>
    </div>
</template>
